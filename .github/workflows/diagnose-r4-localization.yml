name: Diagnose R4 localization coverage

on:
  push:
    branches: [fix/r4-settings-localization]
    paths:
      - .github/workflows/diagnose-r4-localization.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run repository tests
        run: python -m pytest -q
      - name: Clone formal RHI 2.7.0
        run: git clone --depth 1 --branch RHI-2.7.0 https://github.com/RankFTW/RHI.git upstream-release
      - name: Materialize formal release
        run: python tools/materialize.py --source upstream-release --repo . --release-version 2.7.0
      - name: Print fallback text
        run: python tools/print_fallback_text.py --project upstream-release/RenoDXCommander
      - name: Strict localization report
        continue-on-error: true
        run: python tools/check_localization.py --source upstream-release --repo . --strict
      - name: Show localization report
        run: cat reports/localization-report.json && printf '\n--- check report ---\n' && cat reports/check-report.json
