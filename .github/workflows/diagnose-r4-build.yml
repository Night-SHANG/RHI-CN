name: Apply R4 Build Fix

on:
  push:
    branches: [fix/runtime-localization-r4]

permissions:
  contents: write

env:
  PYTHONUTF8: '1'

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Add compiler-regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_cs_transform.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def test_dynamic_text_transform_does_not_capture_method_call_prefix():'
          if marker not in text:
              text += '''\n\ndef test_dynamic_text_transform_does_not_capture_method_call_prefix():\n    src = 'hotkeyBox.Text = HotkeyManager.FormatHotkeyDisplay(vk, shift, ctrl, alt);'\n    out, entries = transform_csharp(src, "SettingsHandler.cs")\n    assert out == src\n    assert entries == {}\n\n\ndef test_dynamic_text_transform_does_not_wrap_ternary_condition():\n    src = 'var run = new Run { Text = isOn ? "On" : "Off" };'\n    out, entries = transform_csharp(src, "SettingsHandler.cs")\n    assert 'Text = isOn ?' in out\n    assert 'LocalizationService.GetDataString(isOn)' not in out\n    assert set(entries.values()) == {"On", "Off"}\n'''
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify regression reproduces before fix
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_cs_transform.py -k "dynamic_text_transform_does_not_capture_method_call_prefix or dynamic_text_transform_does_not_wrap_ternary_condition"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Regression tests unexpectedly passed before the fix."
            exit 1
          fi
          echo "Regression reproduced as expected (pytest exit $code)."
      - name: Patch dynamic Text transform at the source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/transform.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _transform_dynamic_text_properties(text: str) -> str:')
          end = text.index('\n\ndef _inject_combobox_item_template', start)
          replacement = '''def _transform_dynamic_text_properties(text: str) -> str:\n    \"\"\"Localize only simple display-text identifiers, not calls or control expressions.\"\"\"\n    pattern = re.compile(\n        r'\\bText\\s*=\\s*(?P<expr>[A-Za-z_]\\w*(?:\\.[A-Za-z_]\\w*)*)(?=\\s*[,};])'\n    )\n\n    def sub(m: re.Match) -> str:\n        expr = m.group(\"expr\")\n        if expr.startswith(\"RenoDXCommander.Services.LocalizationService\"):\n            return m.group(0)\n        if not _is_probably_text_expression(expr):\n            return m.group(0)\n        return (\n            \"Text = RenoDXCommander.Services.LocalizationService.GetDataString(\"\n            + expr + \")\"\n        )\n\n    return pattern.sub(sub, text)'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Run localization tests after fix
        run: python -m pytest -q
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/transform.py tests/test_cs_transform.py
          git commit -m "fix: stop dynamic text localization from corrupting expressions"
          git push origin HEAD:fix/runtime-localization-r4
