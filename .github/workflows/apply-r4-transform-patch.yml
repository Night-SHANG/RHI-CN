name: Apply R4 Transform Patch

on:
  push:
    branches: [fix/runtime-localization-r4]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-localization-r4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply transform patch
        run: python tools/apply_r4_transform_patch.py
      - name: Clean one-time patch helpers
        run: git rm tools/apply_r4_transform_patch.py .github/workflows/apply-r4-transform-patch.yml
      - name: Commit patched transformer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/transform.py
          git commit -m "fix: localize remaining runtime UI expression patterns"
          git push origin HEAD:fix/runtime-localization-r4
