name: Retain reviewed candidate once
"on":
  push:
    branches: ["release-retention/20261031-9dcf8d25"]
    paths: [".github/workflows/retain-candidate-20261031.yml"]
permissions:
  contents: read
concurrency:
  group: retain-candidate-20261031-9dcf8d25
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fixed manifest verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          """One-shot candidate retention. Stdlib only; no artifact code execution.
          CI entry is generated inline with an immutable per-repository manifest.
          """
          import hashlib,io,json,os,posixpath,re,stat,sys,urllib.request,urllib.error,urllib.parse,zipfile
          class Stop(RuntimeError):pass
          def require(ok,message):
           if not ok:raise Stop(message)
          def sha(data):return hashlib.sha256(data).hexdigest()
          def extract_assets(blob,m):
           require(len(blob)==m['artifact']['size_in_bytes'],'archive size mismatch')
           require('sha256:'+sha(blob)==m['artifact']['digest'],'archive hash mismatch')
           with zipfile.ZipFile(io.BytesIO(blob)) as z:
            infos=z.infolist();require(len(infos)<=4096,'too many members');seen=set();total=0
            for i in infos:
             n=i.filename
             require(n and not n.startswith('/') and '\\' not in n and ':' not in n and not any(p in ('..','.','') for p in n.rstrip('/').split('/')),'unsafe zip path')
             require(n not in seen,'duplicate member');seen.add(n)
             mode=i.external_attr>>16
             require(stat.S_IFMT(mode) in (0,stat.S_IFREG,stat.S_IFDIR),'nonregular zip entry')
             require(not i.flag_bits&1,'encrypted entry')
             total+=i.file_size
             require(total<=1024*1024*1024 and i.file_size<=512*1024*1024,'archive expansion limit')
             require(i.file_size<=max(1,i.compress_size)*1000,'compression ratio limit')
            result={}
            for a in m['assets']:
             require(re.fullmatch(r'[A-Za-z0-9_.-]+',a['name']) and a['name'] not in result,'unsafe asset name')
             require(a['member'] in seen,'missing asset')
             data=z.read(a['member']);require(len(data)==a['size'] and sha(data)==a['sha256'],'asset mismatch')
             result[a['name']]=data
            return result
          
          def guard(m,e,event):
           expected={'GITHUB_ACTIONS':'true','GITHUB_EVENT_NAME':'push','GITHUB_REPOSITORY':m['repository'],'GITHUB_REF':'refs/heads/'+m['publish_branch'],'GITHUB_RUN_ATTEMPT':'1','GITHUB_WORKFLOW_REF':m['repository']+'/'+m['workflow_path']+'@refs/heads/'+m['publish_branch']}
           for k,v in expected.items():require(e.get(k)==v,'context mismatch: '+k)
           require(re.fullmatch('[0-9a-f]{40}',e.get('GITHUB_SHA','')),'invalid publisher sha')
           require(event.get('after')==e['GITHUB_SHA'] and event.get('before')==m['head'],'publisher must be single push after reviewed source')
           require(event.get('forced') is False and event.get('deleted') is False,'forced/deleted event')
           require(event.get('repository',{}).get('full_name')==m['repository'],'event repository mismatch')
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          class API:
           def __init__(self,token,write=False):self.token=token;self.write=write;self.opener=urllib.request.build_opener(NoRedirect)
           def request(self,method,path,body=None,binary=False):
            require(method=='GET' or self.write,'read-only API')
            url=path if path.startswith('https://') else 'https://api.github.com'+path
            u=urllib.parse.urlsplit(url);require(u.scheme=='https' and u.hostname in ('api.github.com','uploads.github.com') and not u.username,'untrusted API endpoint')
            data=body if isinstance(body,bytes) else json.dumps(body).encode() if body is not None else None
            headers={'Authorization':'Bearer '+self.token,'Accept':'application/octet-stream' if binary else 'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/octet-stream' if isinstance(body,bytes) else 'application/json'}
            try:
             response=self.opener.open(urllib.request.Request(url,data=data,method=method,headers=headers),timeout=180)
            except urllib.error.HTTPError as ex:
             if ex.code==404 and method=='GET' and not binary:return None
             if ex.code in (301,302,303,307,308) and method=='GET' and binary:
              target=ex.headers.get('Location','');host=urllib.parse.urlsplit(target)
              require(host.scheme=='https' and not host.username and host.hostname and (host.hostname.endswith('.blob.core.windows.net') or host.hostname=='release-assets.githubusercontent.com' or host.hostname.endswith('.githubusercontent.com')),'untrusted download redirect')
              # Fresh request without Authorization; no automatic chained redirects.
              try:response=self.opener.open(urllib.request.Request(target,headers={'Accept':'application/octet-stream'}),timeout=180)
              except Exception:raise Stop('redirected download failed (URL redacted)') from None
             else:raise Stop('GitHub HTTP '+str(ex.code)+' (details redacted)') from None
            except Exception:raise Stop('GitHub request failed (details redacted)') from None
            with response:
             data=response.read(512*1024*1024+1);require(len(data)<=512*1024*1024,'response exceeds limit')
            return data if binary else json.loads(data)
          
          def verify_publisher(api,m,publisher):
           root='/repos/'+m['repository']
           ref=api.request('GET',root+'/git/ref/heads/'+m['publish_branch'])
           require(ref and ref['object']['sha']==publisher,'publisher branch changed')
           commit=api.request('GET',root+'/commits/'+publisher)
           require(commit and [p['sha'] for p in commit['parents']]==[m['head']],'publisher parent mismatch')
           require(len(commit['files'])==1 and commit['files'][0]['filename']==m['workflow_path'] and commit['files'][0]['status']=='added','publisher must only add fixed workflow')
          
          def verify_remote(api,m):
           root='/repos/'+m['repository']
           ref=api.request('GET',root+'/git/ref/heads/'+m['branch']);require(ref and ref['object']['sha']==m['head'],'source branch changed')
           for commit in (m['head'],m['checkout']):
            c=api.request('GET',root+'/git/commits/'+commit);require(c and c['tree']['sha']==m['tree'],'source/checkout tree mismatch')
           pr=api.request('GET',root+'/pulls/'+str(m['pr']))
           require(pr and pr['state']=='open' and pr['head']['sha']==m['head'] and pr['base']['sha']==m['base'] and pr['head']['repo']['full_name']==m['repository'],'PR binding changed')
           for expected in m['runs']:
            path=root+'/actions/runs/'+str(expected['id'])
            run=api.request('GET',path)
            for key in ('id','head_sha','head_branch','workflow_id','path','run_attempt','event'):
             require(run and run.get(key)==expected[key],'run mismatch: '+key)
            require(run['repository']['full_name']==m['repository'] and run['status']=='completed' and run['conclusion']=='success','run not green')
            attempt=api.request('GET',path+'/attempts/'+str(expected['run_attempt']))
            require(attempt and attempt['conclusion']=='success' and attempt['head_sha']==m['head'] and attempt['run_attempt']==expected['run_attempt'],'attempt mismatch')
            jobs=api.request('GET',path+'/attempts/'+str(expected['run_attempt'])+'/jobs?per_page=100')
            require(jobs and jobs['total_count']==len(expected['jobs']),'job count mismatch')
            actual={j['id']:j for j in jobs['jobs']}
            for j in expected['jobs']:
             got=actual.get(j['id']);require(got and got['name']==j['name'] and got['status']=='completed' and got['conclusion']==j['conclusion'] and got['conclusion'] in ('success','skipped'),'job mismatch')
           a=api.request('GET',root+'/actions/artifacts/'+str(m['artifact']['id']))
           for k in ('id','name','size_in_bytes','digest'):require(a and a.get(k)==m['artifact'][k],'artifact mismatch: '+k)
           require(not a['expired'] and a['workflow_run']['id']==m['runs'][0]['id'] and a['workflow_run']['head_sha']==m['head'],'artifact run mismatch')
           return extract_assets(api.request('GET',root+'/actions/artifacts/'+str(a['id'])+'/zip',binary=True),m)
          
          def verify_uploaded(api,root,rid,files):
           assets=api.request('GET',root+'/releases/'+str(rid)+'/assets?per_page=100')
           require(isinstance(assets,list) and len(assets)==len(files),'asset count mismatch')
           for a in assets:
            require(a['name'] in files and a['state']=='uploaded','unexpected asset')
            data=files[a['name']];require(a['size']==len(data),'uploaded size mismatch')
            if a.get('digest'):require(a['digest']=='sha256:'+sha(data),'uploaded digest mismatch')
            else:require(sha(api.request('GET',root+'/releases/assets/'+str(a['id']),binary=True))==sha(data),'downloaded asset mismatch')
           require(len({a['name'] for a in assets})==len(files),'duplicate uploaded names')
          
          def publish(api,m,files):
           root='/repos/'+m['repository'];tag=urllib.parse.quote(m['tag'],safe='')
           require(api.request('GET',root+'/git/ref/tags/'+tag) is None,'tag already exists')
           require(api.request('GET',root+'/releases/tags/'+tag) is None,'release already exists')
           # List authenticated drafts too: release-by-tag can hide drafts.
           page=1
           while True:
            existing=api.request('GET',root+'/releases?per_page=100&page='+str(page))
            require(isinstance(existing,list),'cannot inspect existing drafts')
            require(all(x['tag_name']!=m['tag'] for x in existing),'draft/tag collision')
            if len(existing)<100:break
            page+=1;require(page<=100,'too many releases to safely inspect')
           rid=None;publication_requested=False
           try:
            tagref=api.request('POST',root+'/git/refs',{'ref':'refs/tags/'+m['tag'],'sha':m['head']})
            require(tagref['object']['type']=='commit' and tagref['object']['sha']==m['head'],'new tag target mismatch')
            created=api.request('POST',root+'/releases',{'tag_name':m['tag'],'target_commitish':m['head'],'name':m['title'],'body':m['notes'],'draft':True,'prerelease':True,'make_latest':'false'})
            rid=created['id'];require(created['draft'] and created['prerelease'] and created['tag_name']==m['tag'],'draft response mismatch')
            for name,data in files.items():
             api.request('POST','https://uploads.github.com'+root+'/releases/'+str(rid)+'/assets?name='+urllib.parse.quote(name,safe=''),data)
            verify_uploaded(api,root,rid,files)
            ref=api.request('GET',root+'/git/ref/tags/'+tag)
            require(ref and ref['object']['type']=='commit' and ref['object']['sha']==m['head'],'prepublication tag target mismatch')
            draft=api.request('GET',root+'/releases/'+str(rid))
            require(draft and draft['id']==rid and draft['tag_name']==m['tag'] and draft['draft'] is True and draft['prerelease'] is True,'prepublication draft identity mismatch')
            publication_requested=True
            api.request('PATCH',root+'/releases/'+str(rid),{'draft':False,'prerelease':True,'make_latest':'false'})
            final=api.request('GET',root+'/releases/'+str(rid));require(not final['draft'] and final['prerelease'] and final['tag_name']==m['tag'],'publication mismatch')
            ref=api.request('GET',root+'/git/ref/tags/'+tag);require(ref and ref['object']['type']=='commit' and ref['object']['sha']==m['head'],'tag target mismatch')
            verify_uploaded(api,root,rid,files)
            return rid
           except Exception as ex:
            prefix=('publication uncertain; release '+str(rid)+' may be public; preserve tag/assets and reconcile exact ID before retry' if publication_requested else 'publication stopped; preserve draft '+str(rid)+' and any tag/assets; reconcile before retry')
            raise Stop(prefix+('; '+str(ex) if isinstance(ex,Stop) else '')) from None
          
          
          def ci_main(m,mode):
           guard(m,os.environ,json.load(open(os.environ['GITHUB_EVENT_PATH'])))
           require(mode in ('verify','publish'),'invalid mode')
           api=API(os.environ['GITHUB_TOKEN'],write=mode=='publish')
           verify_publisher(api,m,os.environ['GITHUB_SHA'])
           files=verify_remote(api,m)
           provenance={**m,'publisher_commit':os.environ['GITHUB_SHA'],'publisher_run':os.environ['GITHUB_RUN_ID']}
           files['provenance.json']=(json.dumps(provenance,sort_keys=True,indent=2)+'\n').encode()
           files['SHA256SUMS']=(''.join(sha(v)+'  '+k+'\n' for k,v in sorted(files.items()))).encode()
           if mode=='publish':print('Verified new candidate release ID',publish(api,m,files))
           else:print('Read-only verification passed for',m['repository'])
          
          MANIFEST = json.loads('{"artifact": {"digest": "sha256:eb5a0f3528dcbaf584ab3b4d3dec5dfded289bccf5257ad775a72eb46e04c5b6", "id": 13050310637, "name": "RHI-CN-windows-package", "size_in_bytes": 109241563}, "assets": [{"member": "installer/RHI-CN-2.8.8-Setup.exe", "name": "RHI-CN-2.8.8-Setup.exe", "sha256": "b801b4ab653b823629b7b5f3a091335c199bdd89b6c1beec8fa251144c033184", "size": 44102489}, {"member": "RHI-CN-2.8.8-portable.zip", "name": "RHI-CN-2.8.8-portable.zip", "sha256": "b6fe9afabccb6d6b8d8069440a3b8d530a7794403d3cfb6ff5674e8aaf9f5c3a", "size": 66278257}], "base": "48f5f18ed997c220ae3da62bbca1d3e7d10af337", "branch": "maintenance/rhi-review-fixes-2026-10-31", "checkout": "e379a050cdb6d3be001be583b1e9b6adc71f8ce0", "head": "9dcf8d25c05377d727bde0fb3e89c47c3d30fcf2", "notes": "Candidate prerelease of reviewed localization maintenance; not a stable release.\\nSource: 9dcf8d25c05377d727bde0fb3e89c47c3d30fcf2\\nActual CI checkout: e379a050cdb6d3be001be583b1e9b6adc71f8ce0\\nCommon tree: e58a431e321a93cc579d03b95e0cbaefaa1aa84e\\nUpstream: 7c8eee421d9d0d5c47e7b89425f46371b282d088\\nWindows CI and package checks passed. Game/GPU/UI visual runtime validation not performed.\\nNo previous release is replaced.\\nIMPORTANT: upstream main is 2.8.9 Beta 2, but upstream AssemblyVersion and installer/portable filenames still say 2.8.8. These files are main-branch candidates, NOT a stable RHI 2.8.8 build.\\n", "pr": 8, "publish_branch": "release-retention/20261031-9dcf8d25", "repository": "Night-SHANG/RHI-CN", "runs": [{"event": "pull_request", "head_branch": "maintenance/rhi-review-fixes-2026-10-31", "head_sha": "9dcf8d25c05377d727bde0fb3e89c47c3d30fcf2", "id": 41220668057, "jobs": [{"conclusion": "success", "id": 124594352067, "name": "build"}], "path": ".github/workflows/build.yml", "run_attempt": 1, "workflow_id": 357025420}, {"event": "pull_request", "head_branch": "maintenance/rhi-review-fixes-2026-10-31", "head_sha": "9dcf8d25c05377d727bde0fb3e89c47c3d30fcf2", "