            if a.get('digest'):require(a['digest']=='sha256:'+sha(data),'uploaded digest mismatch')
            else:require(sha(api.request('GET',root+'/releases/assets/'+str(a['id']),binary=True))==sha(data),'downloaded asset mismatch')
           require(len({a['name'] for a in assets})==len(files),'duplicate uploaded names')
          
          def publish(api,m,files):
           root='/repos/'+m['repository'];tag=urllib.parse.quote(m['tag'],safe='')
           require(api.request('GET',root+'/git/ref/tags/'+tag) is None,'tag already exists')
           require(api.request('GET',root+'/releases/tags/'+tag) is None,'release already exists')
           # List authenticated drafts too: release-by-tag can hide drafts.
           page=1
           while True:
            existing=api.request('GET',root+'/releases?per_page=100&page='+str(page))
            require(isinstance(existing,list),'cannot inspect existing drafts')
            require(all(x['tag_name']!=m['tag'] for x in existing),'draft/tag collision')
            if len(existing)<100:break
            page+=1;require(page<=100,'too many releases to safely inspect')
           rid=None;publication_requested=False
           try:
            tagref=api.request('POST',root+'/git/refs',{'ref':'refs/tags/'+m['tag'],'sha':m['head']})
            require(tagref['object']['type']=='commit' and tagref['object']['sha']==m['head'],'new tag target mismatch')
            created=api.request('POST',root+'/releases',{'tag_name':m['tag'],'target_commitish':m['head'],'name':m['title'],'body':m['notes'],'draft':True,'prerelease':True,'make_latest':'false'})
            rid=created['id'];require(created['draft'] and created['prerelease'] and created['tag_name']==m['tag'],'draft response mismatch')
            for name,data in files.items():
             api.request('POST','https://uploads.github.com'+root+'/releases/'+str(rid)+'/assets?name='+urllib.parse.quote(name,safe=''),data)
            verify_uploaded(api,root,rid,files)
            ref=api.request('GET',root+'/git/ref/tags/'+tag)
            require(ref and ref['object']['type']=='commit' and ref['object']['sha']==m['head'],'prepublication tag target mismatch')
            draft=api.request('GET',root+'/releases/'+str(rid))
            require(draft and draft['id']==rid and draft['tag_name']==m['tag'] and draft['draft'] is True and draft['prerelease'] is True,'prepublication draft identity mismatch')
            publication_requested=True
            api.request('PATCH',root+'/releases/'+str(rid),{'draft':False,'prerelease':True,'make_latest':'false'})
            final=api.request('GET',root+'/releases/'+str(rid));require(not final['draft'] and final['prerelease'] and final['tag_name']==m['tag'],'publication mismatch')
            ref=api.request('GET',root+'/git/ref/tags/'+tag);require(ref and ref['object']['type']=='commit' and ref['object']['sha']==m['head'],'tag target mismatch')
            verify_uploaded(api,root,rid,files)
            return rid
           except Exception as ex:
            prefix=('publication uncertain; release '+str(rid)+' may be public; preserve tag/assets and reconcile exact ID before retry' if publication_requested else 'publication stopped; preserve draft '+str(rid)+' and any tag/assets; reconcile before retry')
            raise Stop(prefix+('; '+str(ex) if isinstance(ex,Stop) else '')) from None
          
          
          def ci_main(m,mode):
           guard(m,os.environ,json.load(open(os.environ['GITHUB_EVENT_PATH'])))
           require(mode in ('verify','publish'),'invalid mode')
           api=API(os.environ['GITHUB_TOKEN'],write=mode=='publish')
           verify_publisher(api,m,os.environ['GITHUB_SHA'])
           files=verify_remote(api,m)
           provenance={**m,'publisher_commit':os.environ['GITHUB_SHA'],'publisher_run':os.environ['GITHUB_RUN_ID']}
           files['provenance.json']=(json.dumps(provenance,sort_keys=True,indent=2)+'\n').encode()
           files['SHA256SUMS']=(''.join(sha(v)+'  '+k+'\n' for k,v in sorted(files.items()))).encode()
           if mode=='publish':print('Verified new candidate release ID',publish(api,m,files))
           else:print('Read-only verification passed for',m['repository'])
          
