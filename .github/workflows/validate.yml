name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run localization tests
        run: python -m pytest -q

  upstream-integration:
    needs: python-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Clone current RHI main
        shell: pwsh
        run: git clone --depth 1 https://github.com/RankFTW/RHI.git upstream
      - name: Materialize localization overlay
        run: python tools/materialize.py --source upstream --repo .
      - name: Validate complete fallback resources
        run: python tools/check_localization.py --source upstream --repo .
      - name: Build and run upstream tests
        shell: pwsh
        run: dotnet test upstream\RenoDXCommander.Tests\RenoDXCommander.Tests.csproj -c Release -p:Platform=x64
