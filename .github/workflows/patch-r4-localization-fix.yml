name: Patch R4 localization fix branch

on:
  push:
    branches: [fix/r4-settings-localization]
    paths:
      - tools/apply_r4_tooltip_interpolation_fix.py
      - .github/workflows/patch-r4-localization-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r4-settings-localization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply interpolated tooltip patch
        run: python tools/apply_r4_tooltip_interpolation_fix.py
      - name: Run Python tests
        run: python -m pip install -r requirements-dev.txt && python -m pytest -q
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/transform.py
          git commit -m 'fix: localize interpolated tooltips [skip ci]'
          git push origin HEAD:fix/r4-settings-localization
