name: Release RHI-CN 2.7.0 r5

on:
  push:
    branches:
      - main
    paths:
      - release-2.7.0-r5-request.json

permissions:
  contents: write

concurrency:
  group: rhi-cn-2.7.0-r5
  cancel-in-progress: false

env:
  UPSTREAM_TAG: RHI-2.7.0
  RHI_VERSION: 2.7.0
  CN_TAG: RHI-CN-2.7.0-r5
  INNO_SETUP_VERSION: '6.7.1'
  INNO_ZH_COMMIT: '1ff90acc4ed4aee82b1cda43253243deee3daed4'
  TRANSLATION_API_URL: ${{ secrets.TRANSLATION_API_URL }}
  TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
  TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run repository tests
        run: python -m pytest -q
      - name: Clone formal upstream release
        shell: pwsh
        run: git clone --depth 1 --branch "$env:UPSTREAM_TAG" https://github.com/RankFTW/RHI.git upstream-release
      - name: Materialize, translate missing text, and require complete Simplified Chinese coverage
        shell: pwsh
        run: |
          python tools\materialize.py --source upstream-release --repo . --release-version "$env:RHI_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\print_fallback_text.py --project upstream-release\RenoDXCommander
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\translate_missing.py --source upstream-release --repo .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream-release reset --hard HEAD
          git -C upstream-release clean -fdx
          python tools\materialize.py --source upstream-release --repo . --release-version "$env:RHI_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\check_localization.py --source upstream-release --repo . --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content reports\localization-report.json -Raw | ConvertFrom-Json
          $fallbackCount = @($report.fallback_keys).Count
          $unhandledCount = @($report.unhandled_csharp).Count
          if ([double]$report.coverage_percent -ne 100.0) { throw "Formal release coverage is $($report.coverage_percent)%, expected 100%." }
          if ($fallbackCount -ne 0) { throw "Formal release still has $fallbackCount fallback keys." }
          if ($unhandledCount -ne 0) { throw "Formal release still has $unhandledCount unhandled C# UI strings." }
      - name: Persist new translation memory
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Localization\translation-memory.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: translate remaining RHI 2.7.0 UI strings [skip ci]"
            git push origin HEAD:main
          }
      - name: Verify fixed 2.7.0 assembly metadata and Window localization guard
        shell: pwsh
        run: |
          $project = Get-Content 'upstream-release\RenoDXCommander\RenoDXCommander.csproj' -Raw
          if ($project -notmatch '<AssemblyVersion>2\.7\.0\.0</AssemblyVersion>') { throw 'AssemblyVersion was not corrected to 2.7.0.0.' }
          if ($project -notmatch '<FileVersion>2\.7\.0\.0</FileVersion>') { throw 'FileVersion was not corrected to 2.7.0.0.' }
          $xaml = Get-Content 'upstream-release\RenoDXCommander\MainWindow.xaml' -Raw
          $root = [regex]::Match($xaml, '<Window\b[\s\S]*?>').Value
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'Unable to locate MainWindow root Window tag.' }
          if ($root -match 'l:Uids\.Uid\s*=') { throw 'Invalid WinUI3Localizer Uid remains on the MainWindow Window root.' }
      - name: Test formal release
        shell: pwsh
        run: dotnet test upstream-release\RenoDXCommander.Tests\RenoDXCommander.Tests.csproj -c Release -p:Platform=x64
      - name: Patch and run official publish script
        shell: pwsh
        run: |
          python tools\patch_publish.py upstream-release\publish.bat "$env:GITHUB_WORKSPACE\publish"
          Push-Location upstream-release
          cmd /c publish.bat
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
          $required = @(
            "$env:GITHUB_WORKSPACE\publish\RHI.exe",
            "$env:GITHUB_WORKSPACE\publish\RHI.DropHelper.exe",
            "$env:GITHUB_WORKSPACE\publish\Strings\en-US\Resources.resw",
            "$env:GITHUB_WORKSPACE\publish\Strings\zh-CN\Resources.resw"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Required publish output missing: $path" } }
          $fileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$env:GITHUB_WORKSPACE\publish\RHI.exe").FileVersion
          if ($fileVersion -notmatch '^2\.7\.0\.0') { throw "Published RHI.exe reports unexpected file version: $fileVersion" }
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -DestinationPath "$env:GITHUB_WORKSPACE\RHI-CN-$env:RHI_VERSION-r5-portable.zip" -Force
      - name: Fetch pinned installer translation
        shell: pwsh
        run: |
          $dir = 'upstream-release\Installer\Languages'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/$env:INNO_ZH_COMMIT/ChineseSimplified.isl"
          Invoke-WebRequest -Uri $url -OutFile "$dir\ChineseSimplified.isl"
          $hash = (Get-FileHash "$dir\ChineseSimplified.isl" -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          @{ repository='kira-96/Inno-Setup-Chinese-Simplified-Translation'; commit=$env:INNO_ZH_COMMIT; sha256=$hash; inno_setup_version=$env:INNO_SETUP_VERSION } | ConvertTo-Json | Set-Content reports\installer-translation.json -Encoding utf8
      - name: Build pinned Inno Setup installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          python tools\patch_installer.py 'upstream-release\RHI Setup.iss' --publish-dir "$env:GITHUB_WORKSPACE\publish" --output-dir "$env:GITHUB_WORKSPACE\installer" --chinese-isl 'Installer\Languages\ChineseSimplified.isl' --version "$env:RHI_VERSION-r5"
          choco install innosetup --version=$env:INNO_SETUP_VERSION -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { & $iscc.Source 'upstream-release\RHI Setup.iss' } else { & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" 'upstream-release\RHI Setup.iss' }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "$env:GITHUB_WORKSPACE\installer\RHI-CN-$env:RHI_VERSION-r5-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Installer missing: $setup" }
      - name: Generate release notes
        shell: pwsh
        run: |
          $report = Get-Content reports\localization-report.json -Raw | ConvertFrom-Json
          $installer = Get-Content reports\installer-translation.json -Raw | ConvertFrom-Json
          $releaseCommit = (git -C upstream-release rev-parse HEAD).Trim()
          @(
            "# RHI-CN $env:RHI_VERSION r5",
            '',
            "- Upstream release: $env:UPSTREAM_TAG",
            "- Upstream commit: ``$releaseCommit``",
            "- Application file version: 2.7.0.0",
            "- Simplified Chinese coverage: $($report.coverage_percent)%",
            "- English fallback keys: 0",
            "- Unhandled C# UI strings: 0",
            "- Inno Setup: $env:INNO_SETUP_VERSION",
            "- Chinese installer translation commit: ``$($installer.commit)``",
            "- Chinese installer translation SHA-256: ``$($installer.sha256)``",
            "- Build date (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss'))",
            '',
            'This r5 release supersedes RHI-CN 2.7.0 r4.',
            'It includes the R4 settings ComboBox stability fix, Tooltip localization fix for mixed ternary/interpolated expressions, and the reviewed runtime fallback cleanup.',
            'CI now enforces zero English runtime fallback so missing translations cannot pass silently.',
            '',
            'This is an unofficial Simplified Chinese build. Core RHI functionality remains upstream RHI.'
          ) | Set-Content reports\release-notes.md -Encoding utf8
      - name: Create immutable r5 release
        shell: pwsh
        run: |
          gh release view $env:CN_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:CN_TAG already exists; refusing to overwrite it." }
          $target = (git rev-parse HEAD).Trim()
          gh release create $env:CN_TAG `
            "$env:GITHUB_WORKSPACE\installer\RHI-CN-$env:RHI_VERSION-r5-Setup.exe" `
            "$env:GITHUB_WORKSPACE\RHI-CN-$env:RHI_VERSION-r5-portable.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --target $target `
            --title "RHI-CN $env:RHI_VERSION r5" `
            --notes-file reports\release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhi-cn-2.7.0-r5-reports
          if-no-files-found: warn
          path: |
            reports/*.json
            reports/*.md
