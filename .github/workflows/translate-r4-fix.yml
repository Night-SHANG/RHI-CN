name: Translate R4 localization gaps

on:
  push:
    branches:
      - fix/r4-settings-localization
    paths:
      - .github/workflows/translate-r4-fix.yml

permissions:
  contents: write

env:
  TRANSLATION_API_URL: ${{ secrets.TRANSLATION_API_URL }}
  TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
  TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
  PYTHONUTF8: '1'

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r4-settings-localization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run repository tests
        run: python -m pytest -q
      - name: Clone formal RHI 2.7.0
        run: git clone --depth 1 --branch RHI-2.7.0 https://github.com/RankFTW/RHI.git upstream-release
      - name: Materialize expanded localization surface
        run: python tools/materialize.py --source upstream-release --repo . --release-version 2.7.0
      - name: Translate all newly discovered runtime text
        run: python tools/translate_missing.py --source upstream-release --repo . --batch-size 20
      - name: Re-materialize and require complete coverage
        run: |
          git -C upstream-release reset --hard HEAD
          git -C upstream-release clean -fdx
          python tools/materialize.py --source upstream-release --repo . --release-version 2.7.0
          python tools/check_localization.py --source upstream-release --repo . --strict
      - name: Commit translation memory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Localization/translation-memory.json
          if git diff --cached --quiet; then
            echo 'No translation-memory changes.'
          else
            git commit -m 'chore: translate expanded RHI 2.7.0 runtime text [skip ci]'
            git push origin HEAD:fix/r4-settings-localization
          fi
